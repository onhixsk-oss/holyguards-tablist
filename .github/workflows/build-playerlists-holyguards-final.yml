name: Build PlayerLists Holyguards r4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-playerlists-holyguards-final.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Holyguards logo URL
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL 'https://raw.githubusercontent.com/onhixsk-oss/holyguards-tablist/main/assets/PlayerLists_Holyguards_logo_300x200.jpg' -o holyguards-logo.jpg
          test -s holyguards-logo.jpg
          file holyguards-logo.jpg
          test "$(wc -c < holyguards-logo.jpg)" -gt 10000

      - name: Download official PlayerLists 2.3.7 from Vintage Story ModDB
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL 'https://moddbcdn.vintagestory.at/PlayerLists-2.3.7_dd7da4fa71f8bd4a10f1e0c0fc54f608.zip?dl=PlayerLists-2.3.7.zip' -o official.zip
          mkdir official
          unzip -q official.zip -d official
          test -f official/PlayerLists.dll
          sha256sum official/PlayerLists.dll

      - name: Build IL patcher
        shell: bash
        run: |
          set -euxo pipefail
          dotnet new console -n patcher -f net10.0
          dotnet add patcher/patcher.csproj package Mono.Cecil --version 0.11.6
          cat > patcher/Program.cs <<'CS'
          using System;
          using System.Linq;
          using Mono.Cecil;
          using Mono.Cecil.Cil;

          const string LogoUrl = "https://raw.githubusercontent.com/onhixsk-oss/holyguards-tablist/main/assets/PlayerLists_Holyguards_logo_300x200.jpg";
          var input = args[0];
          var output = args[1];

          using var asm = AssemblyDefinition.ReadAssembly(input, new ReaderParameters { ReadSymbols = false });
          var module = asm.MainModule;
          var playerList = module.Types.First(t => t.FullName == "playerlists.PlayerList");
          var config = module.Types.First(t => t.FullName == "playerlists.configuration.Config");
          var configField = playerList.Fields.First(f => f.Name == "_config");
          var logoSetter = config.Properties.First(p => p.Name == "Logo").SetMethod
              ?? throw new InvalidOperationException("Config.Logo setter not found");

          static void InjectSetLogoAfter(MethodDefinition method, Instruction anchor, FieldDefinition configField, MethodDefinition logoSetter, string logoUrl)
          {
              var il = method.Body.GetILProcessor();
              var cursor = anchor;
              void Add(Instruction ins) { il.InsertAfter(cursor, ins); cursor = ins; }
              Add(il.Create(OpCodes.Ldarg_0));
              Add(il.Create(OpCodes.Ldfld, configField));
              Add(il.Create(OpCodes.Ldstr, logoUrl));
              Add(il.Create(OpCodes.Callvirt, logoSetter));
              method.Body.MaxStackSize = Math.Max(method.Body.MaxStackSize, 2);
          }

          // 1) Force the server's loaded config to the Holyguards URL immediately after
          //    LoadModConfig assigns _config. This also makes playerlists.json persist the URL.
          var reload = playerList.Methods.First(m => m.Name == "ReloadConfig");
          var reloadStore = reload.Body.Instructions.First(i =>
              i.OpCode == OpCodes.Stfld && i.Operand is FieldReference fr && fr.Name == "_config");
          InjectSetLogoAfter(reload, reloadStore, configField, logoSetter, LogoUrl);

          // 2) Force it again immediately before every packet send, protecting against config reloads.
          var send = playerList.Methods.First(m => m.Name == "SendConfigToPlayer");
          var sendIl = send.Body.GetILProcessor();
          var first = send.Body.Instructions.First();
          var a = sendIl.Create(OpCodes.Ldarg_0);
          var b = sendIl.Create(OpCodes.Ldfld, configField);
          var c = sendIl.Create(OpCodes.Ldstr, LogoUrl);
          var d = sendIl.Create(OpCodes.Callvirt, logoSetter);
          sendIl.InsertBefore(first, a);
          sendIl.InsertAfter(a, b);
          sendIl.InsertAfter(b, c);
          sendIl.InsertAfter(c, d);
          send.Body.MaxStackSize = Math.Max(send.Body.MaxStackSize, 2);

          asm.Write(output, new WriterParameters { WriteSymbols = false });
          Console.WriteLine("Patched ReloadConfig and SendConfigToPlayer");
          Console.WriteLine($"Logo URL: {LogoUrl}");
          CS
          dotnet build patcher/patcher.csproj -c Release

      - name: Patch PlayerLists.dll
        shell: bash
        run: |
          set -euxo pipefail
          cp official/PlayerLists.dll official/PlayerLists.original.dll
          dotnet patcher/bin/Release/net10.0/patcher.dll official/PlayerLists.original.dll official/PlayerLists.dll
          rm official/PlayerLists.original.dll
          test -f official/PlayerLists.dll
          strings -el official/PlayerLists.dll | grep -F 'PlayerLists_Holyguards_logo_300x200.jpg'
          test "$(find official -maxdepth 1 -type f -name '*.dll' | wc -l)" -eq 1
          sha256sum official/PlayerLists.dll

      - name: Verify identity and package
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          with open('official/modinfo.json', encoding='utf-8-sig') as f:
              m=json.load(f)
          assert m['modid']=='playerlists', m
          assert m['version']=='2.3.7', m
          assert m['requiredOnClient'] is True, m
          print('Identity OK:', m['modid'], m['version'])
          PY
          (cd official && zip -qr ../PlayerLists-2.3.7-Holyguards-r4.zip .)
          unzip -t PlayerLists-2.3.7-Holyguards-r4.zip
          unzip -l PlayerLists-2.3.7-Holyguards-r4.zip | grep 'PlayerLists.dll'

      - uses: actions/upload-artifact@v4
        with:
          name: PlayerLists-2.3.7-Holyguards-r4
          path: PlayerLists-2.3.7-Holyguards-r4.zip
          if-no-files-found: error
