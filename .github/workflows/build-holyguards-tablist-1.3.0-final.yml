name: Build Holyguards Tablist 1.3.1 FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-holyguards-tablist-1.3.0-final.yml'
      - 'buildsrc/standalone130/**'
      - 'assets/PlayerLists_Holyguards_logo_300x200.png'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare source and .NET 10
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_WORKSPACE/source"

          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
            export PATH="$HOME/.dotnet:$PATH"
          fi

          dotnet --info
          dotnet --list-sdks | grep '^10\.'

      - name: Download Vintage Story 1.22.6 server assemblies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/vs"
          curl -fL 'https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.6.tar.gz' -o "$GITHUB_WORKSPACE/vs.tar.gz"
          tar -xzf "$GITHUB_WORKSPACE/vs.tar.gz" -C "$GITHUB_WORKSPACE/vs"
          test -f "$GITHUB_WORKSPACE/vs/VintagestoryAPI.dll"

      - name: Prepare standalone source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/BillysArchive/VS-PlayerList.git upstream

          find upstream/src -type f -name '*.cs' -print0 | xargs -0 sed -i 's/playerlist/holyguardstablist/g'
          mv upstream/resources/assets/playerlist upstream/resources/assets/holyguardstablist

          cp "$GITHUB_WORKSPACE/source/buildsrc/standalone130/PlayerListHud.cs" upstream/src/gui/PlayerListHud.cs
          cp "$GITHUB_WORKSPACE/source/buildsrc/standalone130/GuiHolyguardsTable.cs" upstream/src/gui/element/GuiHolyguardsTable.cs

          mkdir -p upstream/resources/assets/holyguardstablist/textures/gui
          cp "$GITHUB_WORKSPACE/source/assets/PlayerLists_Holyguards_logo_300x200.png" upstream/resources/assets/holyguardstablist/textures/gui/tablist.png
          rm -f upstream/resources/assets/holyguardstablist/textures/vs_logo.png

          cat > upstream/resources/modinfo.json <<'JSON'
          {
            "type": "code",
            "name": "Holyguards Tablist",
            "modid": "holyguardstablist",
            "version": "1.3.1",
            "description": "Standalone Holyguards TAB player list with a custom Holyguards HUD.",
            "website": "https://github.com/onhixsk-oss/holyguards-tablist",
            "authors": [ "Holyguards" ],
            "side": "Universal",
            "requiredOnClient": true,
            "requiredOnServer": true,
            "dependencies": { "game": "1.22.3" }
          }
          JSON

          python - <<'PY'
          from pathlib import Path

          cfg = Path('upstream/src/configuration/Config.cs')
          s = cfg.read_text(encoding='utf-8-sig')
          s = s.replace('public string? Logo { get; set; } = "holyguardstablist:textures/vs_logo.png";', 'public string? Logo { get; set; } = null;')
          cfg.write_text(s, encoding='utf-8')

          proj = Path('upstream/PlayerList.csproj')
          s = proj.read_text(encoding='utf-8-sig')
          s = s.replace('<TargetFramework>net8.0</TargetFramework>', '<TargetFramework>net10.0</TargetFramework>')
          s = s.replace('<Version>2.3.4</Version>', '<Version>1.3.1</Version>\n        <AssemblyName>HolyguardsTablist</AssemblyName>')
          s = s.replace('<Description>View the player list on Vintage Story servers</Description>', '<Description>Standalone Holyguards TAB player list with custom HUD</Description>')
          proj.write_text(s, encoding='utf-8')
          PY

          cat > upstream/CREDITS.txt <<'TXT'
          Holyguards Tablist

          Custom Holyguards HUD, branding and packaging by Holyguards.
          Based on the MIT-licensed VS-PlayerList project by William Blake Galbreath / BillyGalbreath and contributors.
          Upstream: https://github.com/BillysArchive/VS-PlayerList
          The upstream MIT LICENSE is included in this package.
          TXT

      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build upstream/PlayerList.csproj -c Release -v:minimal -p:VINTAGE_STORY="$GITHUB_WORKSPACE/vs" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error title=Compiler::$safe"
            done < <(grep -E 'error CS[0-9]+|error MSB[0-9]+|Build FAILED|error :' build.log | tail -n 40)
          fi
          exit "$status"

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          OUTDIR='upstream/bin/Release'
          test -f "$OUTDIR/HolyguardsTablist.dll"

          mkdir package
          cp "$OUTDIR/HolyguardsTablist.dll" package/HolyguardsTablist.dll
          cp upstream/resources/modinfo.json package/modinfo.json
          cp upstream/LICENSE package/LICENSE
          cp upstream/CREDITS.txt package/CREDITS.txt
          cp upstream/README.md package/README.md
          cp upstream/resources/modicon.png package/modicon.png
          cp -R upstream/resources/assets package/assets

          test ! -e package/PlayerLists.dll
          test ! -e package/assets/holyguardstablist/textures/vs_logo.png
          test -f package/assets/holyguardstablist/textures/gui/tablist.png
          test "$(find package -type f -name '*.dll' | wc -l)" -eq 1

          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('package/modinfo.json').read_text())
          assert m['modid'] == 'holyguardstablist'
          assert m['version'] == '1.3.1'
          assert m['requiredOnClient'] is True
          assert m['requiredOnServer'] is True
          dlls = list(Path('package').rglob('*.dll'))
          assert [p.name for p in dlls] == ['HolyguardsTablist.dll']
          print('Identity OK:', m['modid'], m['version'])
          print('DLL OK:', dlls[0])
          PY

          (cd package && zip -qr ../holyguardstablist_1.3.1_test14.zip .)
          unzip -t holyguardstablist_1.3.1_test14.zip
          sha256sum holyguardstablist_1.3.1_test14.zip

      - name: Publish test ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='holyguardstablist-test'
          FILE='holyguardstablist_1.3.1_test14.zip'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Holyguards Tablist Test Build' \
              --notes 'Automated test build for in-game testing.' \
              --prerelease
          fi
