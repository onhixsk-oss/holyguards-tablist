name: Build Holyguards Player List

on:
  workflow_dispatch:
  push:
    paths:
      - 'buildsrc/**'
      - '.github/workflows/build-holyguards.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Vintage Story 1.22.6 server assemblies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/vs"
          curl -fL "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.6.tar.gz" -o "$GITHUB_WORKSPACE/vs.tar.gz"
          tar -xzf "$GITHUB_WORKSPACE/vs.tar.gz" -C "$GITHUB_WORKSPACE/vs"
          test -f "$GITHUB_WORKSPACE/vs/VintagestoryAPI.dll"

      - name: Build DLL
        shell: bash
        run: |
          set +e
          dotnet build buildsrc/HolyguardsPlayerList.csproj -c Release -v:minimal -p:VINTAGE_STORY="$GITHUB_WORKSPACE/vs" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler tail"
            tail -n 80 build.log
            echo "::endgroup::"
            while IFS= read -r line; do
              case "$line" in
                *" error CS"*|*" error MSB"*|*"error NETSDK"*)
                  safe=${line//'%'/'%25'}
                  safe=${safe//$'\r'/'%0D'}
                  safe=${safe//$'\n'/'%0A'}
                  echo "::error title=Holyguards build::$safe"
                  ;;
              esac
            done < build.log
            exit "$status"
          fi
          find buildsrc/bin -maxdepth 4 -type f -print

      - name: Stage artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp buildsrc/bin/Release/net8.0/HolyguardsPlayerList.dll artifact/HolyguardsPlayerList.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: holyguardsplayerlist-dll
          path: artifact/HolyguardsPlayerList.dll
          if-no-files-found: error
