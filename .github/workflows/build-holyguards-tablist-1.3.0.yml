name: Build Holyguards Tablist 1.3.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-holyguards-tablist-1.3.0.yml'
      - 'assets/PlayerLists_Holyguards_logo_300x200.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Vintage Story 1.22.6 server assemblies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/vs"
          curl -fL "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.6.tar.gz" -o "$GITHUB_WORKSPACE/vs.tar.gz"
          tar -xzf "$GITHUB_WORKSPACE/vs.tar.gz" -C "$GITHUB_WORKSPACE/vs"
          test -f "$GITHUB_WORKSPACE/vs/VintagestoryAPI.dll"

      - name: Prepare standalone Holyguards source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/BillysArchive/VS-PlayerList.git upstream

          # Fully separate namespace and asset domain from PlayerLists.
          find upstream/src -type f -name '*.cs' -print0 | xargs -0 sed -i 's/playerlist/holyguardstablist/g'
          mv upstream/resources/assets/playerlist upstream/resources/assets/holyguardstablist

          mkdir -p upstream/resources/assets/holyguardstablist/textures/gui
          cp assets/PlayerLists_Holyguards_logo_300x200.png upstream/resources/assets/holyguardstablist/textures/gui/tablist.png

          cat > upstream/resources/modinfo.json <<'JSON'
          {
            "type": "code",
            "name": "Holyguards Tablist",
            "modid": "holyguardstablist",
            "version": "1.3.0",
            "description": "Standalone Holyguards TAB player list with a custom Holyguards HUD.",
            "website": "https://github.com/onhixsk-oss/holyguards-tablist",
            "authors": [ "Holyguards" ],
            "side": "Universal",
            "requiredOnClient": true,
            "requiredOnServer": true,
            "dependencies": {
              "game": "1.22.3"
            }
          }
          JSON

          # Completely replace the old PlayerLists HUD. No Vintage Story logo,
          # no default grey list and no header/footer from the upstream HUD.
          cat > upstream/src/gui/PlayerListHud.cs <<'CS'
          using holyguardstablist.gui.element;
          using Vintagestory.API.Client;
          using Vintagestory.API.Common;

          namespace holyguardstablist.gui;

          public sealed class PlayerListHud : HudElement {
              private readonly PlayerList _mod;
              private readonly KeyHandler _keyHandler;
              private readonly long _gameTickListenerId;
              private List<string> _players = [];

              public PlayerListHud(PlayerList mod) : base((ICoreClientAPI)mod.Api) {
                  _mod = mod;
                  _keyHandler = new KeyHandler(capi);
                  _gameTickListenerId = capi.Event.RegisterGameTickListener(_ => UpdateList(), 1000);
              }

              public void UpdateList(bool force = false) {
                  List<string> players = capi.World.AllOnlinePlayers
                      .OrderBy(player => player.PlayerName)
                      .Select(player => player.PlayerUID)
                      .ToList();

                  if (!force && _players.SequenceEqual(players)) return;

                  Compose(_players = players);
                  TryOpen();
              }

              private void Compose(List<string> players) {
                  if (players.Count == 0) return;

                  ElementBounds table = new() {
                      Alignment = EnumDialogArea.CenterTop,
                      BothSizing = ElementSizing.Fixed,
                      fixedWidth = GuiHolyguardsTable.Width,
                      fixedHeight = GuiHolyguardsTable.Height
                  };

                  SingleComposer = capi.Gui
                      .CreateCompo("holyguardstablist", new ElementBounds {
                          Alignment = EnumDialogArea.CenterTop,
                          BothSizing = ElementSizing.FitToChildren,
                          fixedOffsetY = 22
                      })
                      .BeginChildElements()
                      .AddStaticElement(new GuiHolyguardsTable(_mod, players, table))
                      .EndChildElements()
                      .Compose();
              }

              public override bool ShouldReceiveRenderEvents() => _keyHandler.IsKeyComboActive();
              public override double InputOrder => 1.0999;
              public override double DrawOrder => 0.8899;
              public override float ZSize => 200F;

              public override bool ShouldReceiveKeyboardEvents() => false;
              public override void OnKeyDown(KeyEvent args) { }
              public override void OnKeyPress(KeyEvent args) { }
              public override void OnKeyUp(KeyEvent args) { }
              public override bool OnEscapePressed() => false;
              public override bool ShouldReceiveMouseEvents() => false;
              public override void OnMouseDown(MouseEvent args) { }
              public override void OnMouseUp(MouseEvent args) { }
              public override void OnMouseMove(MouseEvent args) { }
              public override void OnMouseWheel(MouseWheelEventArgs args) { }
              public override bool OnMouseEnterSlot(ItemSlot slot) => false;
              public override bool OnMouseLeaveSlot(ItemSlot itemSlot) => false;
              public override bool CaptureAllInputs() => false;
              public override bool TryClose() => false;
              public override void Toggle() { }
              public override void UnFocus() { }
              public override void Focus() { }
              public override bool Focused => false;
              protected override void OnFocusChanged(bool on) => focused = false;

              public override void Dispose() {
                  base.Dispose();
                  _keyHandler.Dispose();
                  capi.Event.UnregisterGameTickListener(_gameTickListenerId);
              }
          }
          CS

          cat > upstream/src/gui/element/GuiHolyguardsTable.cs <<'CS'
          using Cairo;
          using holyguardstablist.util;
          using Vintagestory.API.Client;
          using Vintagestory.API.Common;

          namespace holyguardstablist.gui.element;

          public sealed class GuiHolyguardsTable : GuiElement {
              public const double Width = 720;
              public const double Height = 480;
              private const int MaxRows = 10;
              private const double FirstRowY = 190;
              private const double RowHeight = 21.05;
              private const double NameX = 126;
              private const double RankX = 337;
              private const double PingX = 520;

              private readonly List<PlayerData> _players;
              private readonly TextDrawUtil _textUtil = new();
              private readonly BitmapRef _background;

              public GuiHolyguardsTable(PlayerList mod, List<string> players, ElementBounds bounds)
                  : base(mod.Api as ICoreClientAPI, bounds) {
                  _players = players
                      .Take(MaxRows)
                      .Select(uid => new PlayerData(mod, api.World.PlayerByUid(uid)))
                      .ToList();

                  _background = api.Assets
                      .Get(new AssetLocation("holyguardstablist", "textures/gui/tablist.png"))
                      .ToBitmap(api);

                  Bounds.fixedWidth = Width;
                  Bounds.fixedHeight = Height;
              }

              public override void ComposeElements(Context ctx, ImageSurface surface) {
                  Bounds.CalcWorldBounds();

                  surface.Image(
                      _background,
                      (int)Bounds.drawX,
                      (int)Bounds.drawY,
                      (int)scaled(Width),
                      (int)scaled(Height)
                  );

                  for (int i = 0; i < _players.Count; i++) {
                      PlayerData player = _players[i];
                      double y = Bounds.drawY + scaled(FirstRowY + i * RowHeight);

                      CairoFont nameFont = player.Font;
                      nameFont.SetupContext(ctx);
                      _textUtil.DrawTextLine(ctx, nameFont, player.Name, Bounds.drawX + scaled(NameX), y);

                      CairoFont infoFont = Util.DefaultFont;
                      infoFont.SetupContext(ctx);
                      _textUtil.DrawTextLine(ctx, infoFont, "Hráč", Bounds.drawX + scaled(RankX), y);

                      string ping = player.Ping >= 0 ? $"{player.Ping} ms" : "—";
                      _textUtil.DrawTextLine(ctx, infoFont, ping, Bounds.drawX + scaled(PingX), y);
                  }
              }
          }
          CS

          # Set sensible defaults. The custom HUD no longer renders Logo/Header/Footer.
          python - <<'PY'
          from pathlib import Path
          cfg = Path('upstream/src/configuration/Config.cs')
          s = cfg.read_text(encoding='utf-8-sig')
          s = s.replace('public string? Logo { get; set; } = "holyguardstablist:textures/vs_logo.png";', 'public string? Logo { get; set; } = null;')
          s = s.replace('public string? Header { get; set; }', 'public string? Header { get; set; } = null;')
          s = s.replace('public string? Footer { get; set; }', 'public string? Footer { get; set; } = null;')
          cfg.write_text(s, encoding='utf-8')

          proj = Path('upstream/PlayerList.csproj')
          s = proj.read_text(encoding='utf-8-sig')
          s = s.replace('<Version>2.3.4</Version>', '<Version>1.3.0</Version>\n        <AssemblyName>HolyguardsTablist</AssemblyName>')
          s = s.replace('<Description>View the player list on Vintage Story servers</Description>', '<Description>Standalone Holyguards TAB player list with custom HUD</Description>')
          proj.write_text(s, encoding='utf-8')
          PY

          cat > upstream/CREDITS.txt <<'TXT'
          Holyguards Tablist

          Custom Holyguards HUD, branding and packaging by Holyguards.
          Based on the MIT-licensed VS-PlayerList project by William Blake Galbreath / BillyGalbreath and contributors.
          Upstream: https://github.com/BillysArchive/VS-PlayerList
          The upstream MIT LICENSE is included in this package.
          TXT

      - name: Build Holyguards Tablist
        shell: bash
        run: |
          set -euxo pipefail
          dotnet build upstream/PlayerList.csproj -c Release -v:minimal -p:VINTAGE_STORY="$GITHUB_WORKSPACE/vs"

      - name: Package ModDB release
        shell: bash
        run: |
          set -euxo pipefail
          OUTDIR="upstream/bin/Release"
          test -f "$OUTDIR/HolyguardsTablist.dll"

          mkdir -p package
          cp "$OUTDIR/HolyguardsTablist.dll" package/HolyguardsTablist.dll
          cp upstream/resources/modinfo.json package/modinfo.json
          cp upstream/LICENSE package/LICENSE
          cp upstream/CREDITS.txt package/CREDITS.txt
          cp upstream/README.md package/README.md
          cp upstream/resources/modicon.png package/modicon.png
          cp -R upstream/resources/assets package/assets

          # 1.3.0 must be a clean standalone mod with only our DLL/domain.
          test ! -e package/PlayerLists.dll
          test -f package/assets/holyguardstablist/textures/gui/tablist.png
          test "$(find package -type f -name '*.dll' | wc -l)" -eq 1

          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('package/modinfo.json').read_text())
          assert m['modid']=='holyguardstablist'
          assert m['version']=='1.3.0'
          assert m['requiredOnClient'] is True
          assert m['requiredOnServer'] is True
          dlls=list(Path('package').rglob('*.dll'))
          assert [p.name for p in dlls]==['HolyguardsTablist.dll']
          print('Identity OK:', m['modid'], m['version'])
          print('DLL OK:', dlls[0])
          print('Custom HUD asset OK')
          PY

          (cd package && zip -qr ../holyguardstablist_1.3.0.zip .)
          unzip -t holyguardstablist_1.3.0.zip
          sha256sum holyguardstablist_1.3.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: holyguardstablist_1.3.0
          path: holyguardstablist_1.3.0.zip
          if-no-files-found: error
