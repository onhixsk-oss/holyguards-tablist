name: Build standalone Holyguards Tablist 1.2.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-holyguards-tablist-1.2.0.yml'
      - 'assets/PlayerLists_Holyguards_logo_300x200.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Vintage Story 1.22.4 server assemblies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/vs"
          curl -fL "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.4.tar.gz" -o "$GITHUB_WORKSPACE/vs.tar.gz"
          tar -xzf "$GITHUB_WORKSPACE/vs.tar.gz" -C "$GITHUB_WORKSPACE/vs"
          test -f "$GITHUB_WORKSPACE/vs/VintagestoryAPI.dll"

      - name: Prepare standalone source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/BillysArchive/VS-PlayerList.git upstream

          # Make this a genuinely separate mod: unique namespace, asset domain,
          # hotkey code and network channel via Mod.Info.ModID.
          find upstream/src -type f -name '*.cs' -print0 | xargs -0 sed -i 's/playerlist/holyguardstablist/g'

          mv upstream/resources/assets/playerlist upstream/resources/assets/holyguardstablist
          rm -f upstream/resources/assets/holyguardstablist/textures/vs_logo.png
          cp assets/PlayerLists_Holyguards_logo_300x200.png upstream/resources/assets/holyguardstablist/textures/holyguards.png

          cat > upstream/resources/modinfo.json <<'JSON'
          {
            "type": "code",
            "name": "Holyguards Tablist",
            "modid": "holyguardstablist",
            "version": "1.2.0",
            "description": "Standalone Holyguards player list. Hold TAB to view online players and ping.",
            "website": "https://github.com/onhixsk-oss/holyguards-tablist",
            "authors": [ "Holyguards" ],
            "side": "Universal",
            "requiredOnClient": true,
            "requiredOnServer": true,
            "dependencies": {
              "game": "1.22.3"
            }
          }
          JSON

          python - <<'PY'
          from pathlib import Path

          cfg = Path('upstream/src/configuration/Config.cs')
          s = cfg.read_text(encoding='utf-8-sig')
          s = s.replace('public string? Logo { get; set; } = "holyguardstablist:textures/vs_logo.png";',
                        'public string? Logo { get; set; } = "holyguardstablist:textures/holyguards.png";')
          s = s.replace('public string? Header { get; set; }',
                        'public string? Header { get; set; } = "HOLYGUARDS  •  {CurPlayers}/{MaxPlayers}"')
          cfg.write_text(s, encoding='utf-8')

          # Remove obsolete migration to the old PlayerLists logo and move the HUD a little higher.
          pl = Path('upstream/src/PlayerList.cs')
          s = pl.read_text(encoding='utf-8-sig')
          old = '''        if (_config.Logo == "https://i.imgur.com/gTAs0Il.png") {\n            _config.Logo = "holyguardstablist:textures/vs_logo.png";\n        }\n\n'''
          s = s.replace(old, '')
          pl.write_text(s, encoding='utf-8')

          hud = Path('upstream/src/gui/PlayerListHud.cs')
          s = hud.read_text(encoding='utf-8-sig').replace('fixedOffsetY = 100', 'fixedOffsetY = 55')
          hud.write_text(s, encoding='utf-8')

          proj = Path('upstream/PlayerList.csproj')
          s = proj.read_text(encoding='utf-8-sig')
          s = s.replace('<Version>2.3.4</Version>', '<Version>1.2.0</Version>\n        <AssemblyName>HolyguardsTablist</AssemblyName>')
          s = s.replace('<Description>View the player list on Vintage Story servers</Description>', '<Description>Standalone Holyguards player list for Vintage Story</Description>')
          proj.write_text(s, encoding='utf-8')
          PY

          # Add explicit credit while keeping upstream MIT license.
          cat > upstream/CREDITS.txt <<'TXT'
          Holyguards Tablist

          Standalone Holyguards branding and packaging by Holyguards.
          Based on the MIT-licensed VS-PlayerList project by William Blake Galbreath / BillyGalbreath and contributors.
          Upstream: https://github.com/BillysArchive/VS-PlayerList
          The upstream MIT LICENSE is included in this package.
          TXT

      - name: Build standalone DLL
        shell: bash
        run: |
          set -euxo pipefail
          dotnet build upstream/PlayerList.csproj -c Release -v:minimal -p:VINTAGE_STORY="$GITHUB_WORKSPACE/vs"

      - name: Package clean ModDB release
        shell: bash
        run: |
          set -euxo pipefail
          OUTDIR="upstream/bin/Release"
          test -f "$OUTDIR/HolyguardsTablist.dll"

          mkdir -p package
          cp "$OUTDIR/HolyguardsTablist.dll" package/HolyguardsTablist.dll
          cp upstream/resources/modinfo.json package/modinfo.json
          cp upstream/LICENSE package/LICENSE
          cp upstream/CREDITS.txt package/CREDITS.txt
          cp upstream/README.md package/README.md
          cp upstream/resources/modicon.png package/modicon.png
          cp -R upstream/resources/assets package/assets

          # Absolutely no original PlayerLists DLL and no Vintage Story logo fallback.
          test ! -e package/PlayerLists.dll
          test ! -e package/assets/holyguardstablist/textures/vs_logo.png
          test -f package/assets/holyguardstablist/textures/holyguards.png
          test "$(find package -type f -name '*.dll' | wc -l)" -eq 1

          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('package/modinfo.json').read_text())
          assert m['modid']=='holyguardstablist'
          assert m['version']=='1.2.0'
          assert m['requiredOnClient'] is True
          assert m['requiredOnServer'] is True
          dlls=list(Path('package').rglob('*.dll'))
          assert [p.name for p in dlls]==['HolyguardsTablist.dll']
          print('Identity OK:', m['modid'], m['version'])
          print('DLL OK:', dlls[0])
          PY

          (cd package && zip -qr ../holyguardstablist_1.2.0.zip .)
          unzip -t holyguardstablist_1.2.0.zip
          sha256sum holyguardstablist_1.2.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: holyguardstablist_1.2.0
          path: holyguardstablist_1.2.0.zip
          if-no-files-found: error
