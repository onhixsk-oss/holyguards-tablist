name: Build standalone Holyguards Tablist 1.2.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-holyguards-tablist-1.2.0.yml'
      - 'assets/PlayerLists_Holyguards_logo_300x200.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download exact official PlayerLists 2.3.7
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL 'https://moddbcdn.vintagestory.at/PlayerLists-2.3.7_dd7da4fa71f8bd4a10f1e0c0fc54f608.zip?dl=PlayerLists-2.3.7.zip' -o official.zip
          mkdir official
          unzip -q official.zip -d official
          test -f official/PlayerLists.dll
          sha256sum official/PlayerLists.dll

      - name: Build standalone IL patcher
        shell: bash
        run: |
          set -euxo pipefail
          dotnet new console -n patcher -f net10.0
          dotnet add patcher/patcher.csproj package Mono.Cecil --version 0.11.6
          cat > patcher/Program.cs <<'CS'
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using Mono.Cecil;
          using Mono.Cecil.Cil;

          const string NewModId = "holyguardstablist";
          const string NewAssetDomain = "holyguardstablist";
          const string LogoAsset = "holyguardstablist:textures/holyguards.png";

          if (args.Length != 2) throw new ArgumentException("input output");
          using var asm = AssemblyDefinition.ReadAssembly(args[0], new ReaderParameters { ReadSymbols = false });
          var module = asm.MainModule;

          asm.Name.Name = "HolyguardsTablist";
          module.Name = "HolyguardsTablist.dll";

          IEnumerable<TypeDefinition> Types(IEnumerable<TypeDefinition> roots)
          {
              foreach (var t in roots)
              {
                  yield return t;
                  foreach (var n in Types(t.NestedTypes)) yield return n;
              }
          }

          var allTypes = Types(module.Types).ToList();
          foreach (var type in allTypes)
          {
              if (type.Namespace == "playerlists" || type.Namespace.StartsWith("playerlists."))
              {
                  type.Namespace = "holyguardstablist" + type.Namespace.Substring("playerlists".Length);
              }
          }

          int stringsChanged = 0;
          foreach (var type in allTypes)
          foreach (var method in type.Methods)
          {
              if (!method.HasBody) continue;
              foreach (var ins in method.Body.Instructions)
              {
                  if (ins.OpCode != OpCodes.Ldstr || ins.Operand is not string s) continue;
                  string n = s;
                  if (n == "playerlists") n = NewModId;
                  if (n == "playerlist") n = NewAssetDomain;
                  n = n.Replace("playerlists-server.json", "holyguardstablist-server.json");
                  n = n.Replace("playerlists:", "holyguardstablist:");
                  n = n.Replace("playerlist:", "holyguardstablist:");
                  n = n.Replace("textures/vs_logo.png", "textures/holyguards.png");
                  if (n != s) { ins.Operand = n; stringsChanged++; }
              }
          }

          var playerList = allTypes.First(t => t.FullName == "holyguardstablist.PlayerList");
          var config = allTypes.First(t => t.FullName == "holyguardstablist.configuration.Config");
          var configField = playerList.Fields.First(f => f.Name == "_config");
          var logoSetter = config.Properties.First(p => p.Name == "Logo").SetMethod ?? throw new InvalidOperationException("Logo setter missing");
          var showPingSetter = config.Properties.First(p => p.Name == "ShowPing").SetMethod ?? throw new InvalidOperationException("ShowPing setter missing");
          var send = playerList.Methods.First(m => m.Name == "SendConfigToPlayer");
          var il = send.Body.GetILProcessor();
          var first = send.Body.Instructions.First();

          // Force bundled Holyguards branding into the server-pushed config.
          var seq = new[] {
              il.Create(OpCodes.Ldarg_0),
              il.Create(OpCodes.Ldfld, configField),
              il.Create(OpCodes.Ldstr, LogoAsset),
              il.Create(OpCodes.Callvirt, logoSetter),
              il.Create(OpCodes.Ldarg_0),
              il.Create(OpCodes.Ldfld, configField),
              il.Create(OpCodes.Ldc_I4_1),
              il.Create(OpCodes.Callvirt, showPingSetter)
          };
          foreach (var ins in seq) il.InsertBefore(first, ins);
          send.Body.MaxStackSize = Math.Max(send.Body.MaxStackSize, 2);

          asm.Write(args[1], new WriterParameters { WriteSymbols = false });
          Console.WriteLine($"Standalone patch complete. Renamed types: {allTypes.Count(t => t.Namespace.StartsWith("holyguardstablist"))}; strings changed: {stringsChanged}");
          Console.WriteLine($"Forced logo: {LogoAsset}");
          CS
          dotnet build patcher/patcher.csproj -c Release

      - name: Create clean standalone package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          dotnet patcher/bin/Release/net10.0/patcher.dll official/PlayerLists.dll package/HolyguardsTablist.dll

          # Move the original assets into our own namespace and replace the VS logo.
          mkdir -p package/assets
          cp -R official/assets/playerlist package/assets/holyguardstablist
          rm -f package/assets/holyguardstablist/textures/vs_logo.png
          cp assets/PlayerLists_Holyguards_logo_300x200.png package/assets/holyguardstablist/textures/holyguards.png

          cat > package/modinfo.json <<'JSON'
          {
            "type": "code",
            "name": "Holyguards Tablist",
            "modid": "holyguardstablist",
            "version": "1.2.0",
            "description": "Standalone Holyguards player list. Hold TAB to view online players and ping.",
            "website": "https://github.com/onhixsk-oss/holyguards-tablist",
            "authors": [ "Holyguards" ],
            "side": "Universal",
            "requiredOnClient": true,
            "requiredOnServer": true,
            "dependencies": { "game": "1.22.3" }
          }
          JSON

          cp official/LICENSE package/LICENSE
          cp official/modicon.png package/modicon.png
          cat > package/README.md <<'TXT'
          # Holyguards Tablist

          Standalone Holyguards player list for Vintage Story.
          Hold TAB to display online players and ping.

          This package uses its own mod id, assembly name, code namespace, network channel,
          config files and asset domain. It does not require the PlayerLists mod.

          Credits: based on the MIT-licensed PlayerLists project by William Blake Galbreath
          (BillyGalbreath) and contributors. The upstream MIT license is included.
          TXT
          cat > package/CREDITS.txt <<'TXT'
          Holyguards Tablist
          Holyguards standalone branding and packaging.

          Based on the MIT-licensed PlayerLists project by William Blake Galbreath / BillyGalbreath and contributors.
          Upstream: https://github.com/BillysArchive/VS-PlayerList
          TXT

          test ! -e package/PlayerLists.dll
          test ! -e package/assets/holyguardstablist/textures/vs_logo.png
          test ! -e package/assets/playerlist
          test -f package/HolyguardsTablist.dll
          test -f package/assets/holyguardstablist/textures/holyguards.png
          test "$(find package -type f -name '*.dll' | wc -l)" -eq 1

          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('package/modinfo.json').read_text())
          assert m['modid']=='holyguardstablist'
          assert m['version']=='1.2.0'
          assert m['requiredOnClient'] is True and m['requiredOnServer'] is True
          assert [p.name for p in Path('package').rglob('*.dll')]==['HolyguardsTablist.dll']
          print('Identity/package checks OK')
          PY

          (cd package && zip -qr ../holyguardstablist_1.2.0.zip .)
          unzip -t holyguardstablist_1.2.0.zip
          sha256sum holyguardstablist_1.2.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: holyguardstablist_1.2.0
          path: holyguardstablist_1.2.0.zip
          if-no-files-found: error
