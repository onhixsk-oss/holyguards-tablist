name: Generate Holyguards PNG logo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-logo-png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert JPEG to standard PNG
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('assets/PlayerLists_Holyguards_logo_300x200.jpg').convert('RGBA')
          src.save('assets/PlayerLists_Holyguards_logo_300x200.png', format='PNG', optimize=True)
          print(src.size, src.mode)
          PY
          file assets/PlayerLists_Holyguards_logo_300x200.png

      - name: Commit PNG
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/PlayerLists_Holyguards_logo_300x200.png
          if git diff --cached --quiet; then
            echo 'PNG already up to date'
          else
            git commit -m 'Add PNG Holyguards PlayerLists logo'
            git push
          fi
