name: Decompile PlayerLists 2.3.7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/decompile-playerlists.yml'

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install ILSpy
        run: dotnet tool install --global ilspycmd
      - name: Decompile exact original DLL
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p decompiled
          ilspycmd -p -o decompiled buildsrc/PlayerLists.original.dll
          find decompiled -maxdepth 4 -type f -print
      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: playerlists-2.3.7-decompiled
          path: decompiled
